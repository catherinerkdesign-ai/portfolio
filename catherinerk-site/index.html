            .staticrypt-instructions { margin: 0 0 4px; }
            .staticrypt-instructions p { margin: 0 0 10px; line-height: 1.6; color: var(--muted); font-size: 15px; }
            .staticrypt-instructions p.staticrypt-title {
                font-size: 28px;
                font-weight: 300;
                line-height: 1.2;
                color: var(--text);
                margin-bottom: 12px;
            }
            .staticrypt-hr { margin: 20px 0; border: 0; border-top: 1px solid var(--line); }
            .staticrypt-password-container {
                position: relative;
                background: var(--field);
                border: 1px solid var(--field-line);
                border-radius: 10px;
                margin: 0 0 16px;
                box-sizing: border-box;
            }
            .staticrypt-password-container:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                color: var(--text);
                font: inherit;
                font-size: 16px;
                outline: 0;
                padding: 14px 48px 14px 16px;
                width: 100%;
            }
            .staticrypt-form input::placeholder { color: var(--muted); }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                width: 20px;
                opacity: 0.6;
                padding: 12px;
                position: absolute;
                right: 2px;
                top: 50%;
                transform: translateY(-50%);
            }
            @media (prefers-color-scheme: dark) { .staticrypt-toggle-password-visibility { filter: invert(1); } }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 22px;
                font-size: 15px;
                color: var(--text);
                cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%;
                padding: 14px 20px;
                border: 2px solid var(--accent);
                border-radius: 999px;
                background: var(--accent);
                color: var(--on-accent);
                font: inherit;
                font-size: 14px;
                font-weight: 500;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                cursor: pointer;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { filter: brightness(1.08); }
            .staticrypt-form .staticrypt-decrypt-button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; background: var(--page); }
            .staticrypt-spinner {
                display: inline-block; width: 2rem; height: 2rem;
                border: 0.25em solid var(--muted); border-right-color: transparent; border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
            @media (prefers-reduced-motion: reduce) { .staticrypt-spinner { animation-duration: 2s; } }
        </style>
